name: Mirror Release

# 一次性补救流程：只把既有 run 的构建产物补建为 GitHub Release，
# 不重新构建、不重新上传 apphub。使用完成后删除本文件与触发标签。
#
# 触发（workflow_dispatch 无法从非默认分支解析本文件，改用标签触发）：
#   git tag mirror-release-beta12 && git push origin mirror-release-beta12

on:
  push:
    tags:
      - 'mirror-release-*'

permissions:
  actions: read
  contents: write

jobs:
  mirror:
    name: Mirror GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '43172578682'
      VERSION: '1.6.0-beta.12'
      TAG: v1.6.0-beta.12
      TARGET_SHA: 'ac866a2e47dd0f69dc447d72cac8502438db948e'
      NOTES: |
        - 优化：切换标签时复用已渲染的预览，长文档来回切换更流畅
        - 优化：长文档输入更顺畅，输入时大纲刷新不再拖慢编辑
        - 优化：macOS 安装包按 Intel 与 Apple 芯片分别提供，下载体积更小
    steps:
      # gh release create 需要 git 仓库上下文，否则报 “not a git repository”
      - uses: actions/checkout@v7

      - name: Download artifacts from source run
        run: |
          set -euo pipefail
          mkdir -p dist flat
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir dist
          find dist -type f -exec mv -t flat {} +
          ls -lh flat

      - name: Label release assets with platform and arch
        run: |
          set -euo pipefail
          mkdir -p release-assets
          copy() {
            if [ ! -f "$1" ]; then
              echo "::error::Missing release asset: $1"
              exit 1
            fi
            cp "$1" "release-assets/$2"
          }
          copy "flat/mark-it-$VERSION-setup.exe" "mark-it-$VERSION-windows-x64-setup.exe"
          copy "flat/mark-it-$VERSION-setup.exe.blockmap" "mark-it-$VERSION-windows-x64-setup.exe.blockmap"
          for arch in x64 arm64; do
            copy "flat/mark-it-$VERSION-$arch.dmg" "mark-it-$VERSION-macos-$arch.dmg"
            copy "flat/mark-it-$VERSION-$arch.zip" "mark-it-$VERSION-macos-$arch.zip"
            copy "flat/mark-it-$VERSION-$arch.zip.blockmap" "mark-it-$VERSION-macos-$arch.zip.blockmap"
          done
          copy "flat/mark-it-$VERSION.AppImage" "mark-it-$VERSION-linux-x64.AppImage"
          # electron-builder 当前不为 AppImage 生成 blockmap，存在时才一并分发
          if [ -f "flat/mark-it-$VERSION.AppImage.blockmap" ]; then
            cp "flat/mark-it-$VERSION.AppImage.blockmap" "release-assets/mark-it-$VERSION-linux-x64.AppImage.blockmap"
          fi
          copy "flat/mark-it_${VERSION}_amd64.deb" "mark-it-$VERSION-linux-x64.deb"
          ls -lh release-assets

      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：刷新说明并覆盖同名产物"
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES" "${flags[@]}"
            gh release upload "$TAG" release-assets/* --clobber
            exit 0
          fi

          echo "创建 Release $TAG"
          # 通过 Git References API 建 tag：只需 contents: write。
          # 不能用 gh release create --target：当目标提交的 workflow 文件与默认分支
          # 不一致时，releases API 会额外要求 workflows: write，GITHUB_TOKEN 无法获得。
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA"
          fi
          gh release create "$TAG" release-assets/* --title "$TAG" --notes "$NOTES" "${flags[@]}"
