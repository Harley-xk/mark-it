name: Release

# 三平台并行构建 → prepare 创建 apphub 草稿 → 四槽位并行上传（Windows x64 / macOS x64
# / macOS arm64 / Linux x64，OSS multipart 自适应）→ 自动发布并验证
# → 同步产物到同版本 GitHub Release（附件名补平台与架构）
#
# 触发方式：
#   1. 推送 v* 标签（推荐，版本号来自标签）
#   2. 手动 workflow_dispatch（可指定版本号与更新说明）
#
# 首次使用前需在仓库 Settings 中配置 Secrets：
#   APPHUB_USERNAME / APPHUB_PASSWORD / APPHUB_SIGN_SECRET
# 发布无人工审批门：草稿上传完成后立即对客户端可见。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（semver，例如 1.4.0；留空则取标签名）'
        required: false
        type: string
      notes:
        description: '更新说明（留空则按上一个 tag / 发布提交自动生成）'
        required: false
        type: string
      force:
        description: '标记为强制更新'
        required: false
        default: false
        type: boolean
      replace:
        description: '重跑同一版本时勾选；已有平台包替换，不存在的平台包按新增处理'
        required: false
        default: false
        type: boolean
      multipart:
        description: 'OSS 上传模式（auto：大文件分片；off：全部回退单次 PUT）'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - off

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      config: ${{ steps.version.outputs.config }}
    steps:
      # 需要完整 tag 历史：通道与上一个发版节点都从 tag 计算
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::版本号不是合法 semver（允许 X.Y.Z 或 X.Y.Z-beta.N）：$VERSION"
            exit 1
          fi
          # 严格单序列：任何新版本必须大于已发布的全部版本
          node scripts/release/channel-state.mjs validate --version "$VERSION"
          CHANNEL=$(node scripts/release/channel-state.mjs channel --version "$VERSION")
          if [ "$CHANNEL" = "beta" ]; then
            CONFIG=.apphub-release.beta.ci.json
          else
            CONFIG=.apphub-release.ci.json
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION（通道 $CHANNEL，配置 $CONFIG）"

  test:
    name: Unit tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # 纯函数回归；e2e 依赖构建产物与真实窗口，不在发版 CI 中运行
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            command: npm run build:win
            paths: |
              dist/*-setup.exe
              dist/*-setup.exe.blockmap
          - os: macos-latest
            name: macos
            # 按 apphub 最新设计分架构发布：一次构建同时产出 Intel 与 Apple Silicon 两套 dmg / zip
            command: npm run build && npx electron-builder --mac --x64 --arm64
            paths: |
              dist/*-x64.dmg
              dist/*-arm64.dmg
              dist/*-x64.zip
              dist/*-arm64.zip
              dist/*-x64.zip.blockmap
              dist/*-arm64.zip.blockmap
          - os: ubuntu-latest
            name: linux-x64
            command: npm run build && npx electron-builder --linux
            paths: |
              dist/*.AppImage
              dist/*.AppImage.blockmap
              dist/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # 未配置代码签名证书时，避免 electron-builder 自动发现并尝试签名
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Set version
        run: npm version "${{ needs.validate.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: ${{ matrix.command }}

      - name: Ensure release credentials are not packaged
        shell: bash
        run: |
          set -euo pipefail
          count=0
          # app.asar 路径可能含空格（如 macOS 的 "Mark It.app"），必须逐条按原文处理
          while IFS= read -r -d '' asar; do
            count=$((count + 1))
            if grep -a -q -e 'apphub-release' -e 'signSecret' "$asar"; then
              echo "::error::app.asar 中包含发版凭据相关文件：$asar"
              exit 1
            fi
          done < <(find dist -name app.asar -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::未找到 app.asar，无法校验打包内容"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  prepare:
    name: Prepare apphub draft
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # 复用自动生成的更新说明作为 GitHub Release 正文，避免两处口径不一致
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      config: ${{ steps.metadata.outputs.config }}
      notes: ${{ steps.notes.outputs.notes }}
    env:
      APPHUB_USERNAME: ${{ secrets.APPHUB_USERNAME }}
      APPHUB_PASSWORD: ${{ secrets.APPHUB_PASSWORD }}
      APPHUB_SIGN_SECRET: ${{ secrets.APPHUB_SIGN_SECRET }}
      VERSION: ${{ needs.validate.outputs.version }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      CONFIG: ${{ needs.validate.outputs.config }}
      REPLACE: ${{ inputs.replace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Export release metadata
        id: metadata
        run: |
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "config=$CONFIG"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            git fetch --tags --force
            # 从上一个同通道节点开始收集；stable 因此天然覆盖其间所有 beta 提交
            PREV_TAG=$(node scripts/release/channel-state.mjs previous-tag --channel "$CHANNEL" --version "$VERSION")
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log "$PREV_TAG..HEAD" --no-merges --pretty='- %s' | grep -v '^- chore(release)' || true)
            else
              PREV_RELEASE=$(git log --grep='^chore(release)' -n1 --format=%H HEAD^ -- . 2>/dev/null || true)
              if [ -n "$PREV_RELEASE" ]; then
                NOTES=$(git log "$PREV_RELEASE..HEAD" --no-merges --pretty='- %s' | grep -v '^- chore(release)' || true)
              else
                NOTES=$(git log -n10 --no-merges --pretty='- %s')
              fi
            fi
          fi
          if [ -z "$NOTES" ]; then
            NOTES="维护版本更新"
          fi
          echo "----- 更新说明 -----"
          echo "$NOTES"
          {
            echo 'notes<<APPHUB_NOTES_EOF'
            echo "$NOTES"
            echo 'APPHUB_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft version
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(create-version --config "$CONFIG" --version "$VERSION" --title "v$VERSION" --notes="$NOTES")
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          node scripts/release/apphub.mjs "${args[@]}"

  upload:
    name: Upload ${{ matrix.name }}
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: windows-x64
            platform: windows
            arch: x64
            artifact: windows-x64
          - name: macos-x64
            platform: macos
            arch: x64
            artifact: macos
          - name: macos-arm64
            platform: macos
            arch: arm64
            artifact: macos
          - name: linux-x64
            platform: linux
            arch: x64
            artifact: linux-x64
    env:
      APPHUB_USERNAME: ${{ secrets.APPHUB_USERNAME }}
      APPHUB_PASSWORD: ${{ secrets.APPHUB_PASSWORD }}
      APPHUB_SIGN_SECRET: ${{ secrets.APPHUB_SIGN_SECRET }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CONFIG: ${{ needs.prepare.outputs.config }}
      REPLACE: ${{ inputs.replace }}
      MULTIPART: ${{ inputs.multipart || 'auto' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download ${{ matrix.name }} artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: List artifact
        run: ls -lh dist

      - name: Upload package
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            windows)
              file=$(find dist -type f -name '*-setup.exe' -print -quit)
              map=$(find dist -type f -name '*-setup.exe.blockmap' -print -quit)
              ;;
            macos)
              # macOS 自动更新（electron-updater/Squirrel.Mac）只认 zip，dmg 仅保留为构建产物；
              # 按架构精确取包，避免 x64 job 误传 arm64 产物
              file=$(find dist -type f -name "*-${ARCH}.zip" -print -quit)
              map=$(find dist -type f -name "*-${ARCH}.zip.blockmap" -print -quit)
              ;;
            linux)
              file=$(find dist -type f -name '*.AppImage' -print -quit)
              map=$(find dist -type f -name '*.AppImage.blockmap' -print -quit)
              ;;
            *)
              echo "::error::Unsupported platform: $PLATFORM"
              exit 1
              ;;
          esac
          if [ -z "$file" ]; then
            echo "::error::No upload package found for $PLATFORM/$ARCH"
            exit 1
          fi
          args=(upload --config "$CONFIG" --version "$VERSION" --platform "$PLATFORM" --arch "$ARCH" --file "$file")
          if [ -n "$map" ]; then args+=(--blockmap "$map"); fi
          if [ "$REPLACE" = "true" ]; then args+=(--replace); fi
          args+=(--multipart "$MULTIPART")
          node scripts/release/apphub-upload.mjs "${args[@]}"

  publish:
    name: Publish
    needs: [validate, prepare, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPHUB_USERNAME: ${{ secrets.APPHUB_USERNAME }}
      APPHUB_PASSWORD: ${{ secrets.APPHUB_PASSWORD }}
      APPHUB_SIGN_SECRET: ${{ secrets.APPHUB_SIGN_SECRET }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CONFIG: ${{ needs.prepare.outputs.config }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish version
        run: node scripts/release/apphub.mjs publish --config "$CONFIG" --version "$VERSION"

      - name: Verify update detection
        run: |
          set -euo pipefail
          for spec in "windows x64" "macos x64" "macos arm64" "linux x64"; do
            read -r platform arch <<< "$spec"
            echo "----- verify $platform/$arch -----"
            node scripts/release/apphub.mjs verify --config "$CONFIG" --expect "$VERSION" --platform "$platform" --arch "$arch"
          done

  github-release:
    name: Publish to GitHub Release
    needs: [validate, prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 仅在 GITHUB_TOKEN 作用域内生效，用于创建 tag / Release 并上传产物
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: v${{ needs.validate.outputs.version }}
    steps:
      # gh release create 需要 git 仓库上下文，否则报 “not a git repository”
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      # 用户从 GitHub Release 手动下载时需要直接区分平台与架构；
      # apphub 侧仍使用 electron-builder 原始文件名，这里只复制为带标识的附件名。
      - name: Label release assets with platform and arch
        run: |
          set -euo pipefail
          mkdir -p release-assets
          copy() {
            if [ ! -f "$1" ]; then
              echo "::error::Missing release asset: $1"
              exit 1
            fi
            cp "$1" "release-assets/$2"
          }
          copy "dist/mark-it-$VERSION-setup.exe" "mark-it-$VERSION-windows-x64-setup.exe"
          copy "dist/mark-it-$VERSION-setup.exe.blockmap" "mark-it-$VERSION-windows-x64-setup.exe.blockmap"
          for arch in x64 arm64; do
            copy "dist/mark-it-$VERSION-$arch.dmg" "mark-it-$VERSION-macos-$arch.dmg"
            copy "dist/mark-it-$VERSION-$arch.zip" "mark-it-$VERSION-macos-$arch.zip"
            copy "dist/mark-it-$VERSION-$arch.zip.blockmap" "mark-it-$VERSION-macos-$arch.zip.blockmap"
          done
          copy "dist/mark-it-$VERSION.AppImage" "mark-it-$VERSION-linux-x64.AppImage"
          # electron-builder 当前不为 AppImage 生成 blockmap，存在时才一并分发
          if [ -f "dist/mark-it-$VERSION.AppImage.blockmap" ]; then
            cp "dist/mark-it-$VERSION.AppImage.blockmap" "release-assets/mark-it-$VERSION-linux-x64.AppImage.blockmap"
          fi
          copy "dist/mark-it_${VERSION}_amd64.deb" "mark-it-$VERSION-linux-x64.deb"
          ls -lh release-assets

      - name: Create or update GitHub Release
        env:
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          # 预发布版本（1.4.0-beta.1）标记为 prerelease，不会被当成 latest
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：刷新说明并覆盖同名产物"
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES" "${flags[@]}"
            gh release upload "$TAG" release-assets/* --clobber
            exit 0
          fi

          echo "创建 Release $TAG"
          # 手动触发时通常还没有 tag，由 gh 在目标提交上补建
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" release-assets/* --title "$TAG" --notes "$NOTES" "${flags[@]}"
          else
            gh release create "$TAG" release-assets/* --title "$TAG" --notes "$NOTES" \
              --target "$GITHUB_SHA" "${flags[@]}"
          fi
